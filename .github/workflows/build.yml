name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (daemon + Qt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libboost-filesystem-dev libboost-program-options-dev libboost-thread-dev libboost-chrono-dev \
            libboost-iostreams-dev libssl-dev libdb++-dev libminiupnpc-dev libqrencode-dev zlib1g-dev \
            qtbase5-dev qttools5-dev-tools qtbase5-dev-tools

      - name: Build coppercoind
        run: |
          cd src
          make -k -f makefile.unix -j"$(nproc)" 2>&1 | tee ../build-daemon.log
          test "${PIPESTATUS[0]}" -eq 0
          strip coppercoind

      - name: Build coppercoin-qt
        run: |
          qmake USE_QRCODE=1 USE_UPNP=1 USE_DBUS=1 Coppercoin-qt.pro
          make -k -j"$(nproc)" 2>&1 | tee build-qt.log
          test "${PIPESTATUS[0]}" -eq 0
          strip coppercoin-qt

      - name: Report compiler errors
        if: failure()
        run: |
          { cat build-*.log 2>/dev/null | grep -v -i "warning" | grep -i -E "error|undefined reference|No such file|cannot find|not found|multiple definition" | grep -v -E "runtime_error|bignum_error|key_error|_error\(|error_code" | head -60; \
            grep -B4 -E "\*\*\* \[" build-qt.log 2>/dev/null | grep -v "warning" | head -40; } | \
            while IFS= read -r l; do echo "::error::${l//%/%25}"; done || true

      - uses: actions/upload-artifact@v5
        with:
          name: coppercoin-linux-x86_64
          path: |
            src/coppercoind
            coppercoin-qt

  windows:
    name: Windows (Qt)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            git
            zip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-qrencode
            mingw-w64-ucrt-x86_64-qt5-base
            mingw-w64-ucrt-x86_64-qt5-tools

      - name: Show library names
        run: |
          ls /ucrt64/lib | grep -E "boost_(thread|filesystem|program_options|chrono)|db_cxx|miniupnpc" || true
          ls /ucrt64/bin | grep -i qmake || true

      # Berkeley DB 5.3 (Sleepycat license), the same version the Linux builds
      # use, so wallets are interchangeable. MSYS2 only ships 6.x (AGPL, DLL).
      - name: Build static Berkeley DB 5.3.28
        run: |
          T="$(cygpath -u "$RUNNER_TEMP")"
          git clone --depth 1 --branch v5.3.28 https://github.com/berkeleydb/libdb.git "$T/bdb"
          cd "$T/bdb"
          # Rename a function that clashes with a GCC built-in
          sed -i 's/__atomic_compare_exchange/__atomic_compare_exchange_db/g' src/dbinc/atomic.h
          cd build_unix
          ../dist/configure --host=x86_64-w64-mingw32 --build=x86_64-w64-mingw32 \
            --enable-mingw --enable-cxx --disable-shared --disable-replication \
            --prefix="$T/bdb-install" CFLAGS="-O2 -std=gnu17"
          make -j"$(nproc)" libdb.a libdb_cxx.a
          make install_lib install_include

      - name: Build coppercoin-qt
        run: |
          BDB="$(cygpath -m "$RUNNER_TEMP/bdb-install")"
          QMAKE=$(command -v qmake-qt5 || command -v qmake)
          LRELEASE=$(command -v lrelease-qt5 || command -v lrelease)
          "$QMAKE" -spec win32-g++ "CONFIG+=release" \
            QMAKE_LRELEASE="$LRELEASE" \
            USE_QRCODE=1 USE_UPNP=1 \
            BOOST_LIB_SUFFIX=-mt BOOST_THREAD_LIB_SUFFIX=-mt \
            "BDB_INCLUDE_PATH=$BDB/include" "BDB_LIB_PATH=$BDB/lib" \
            Coppercoin-qt.pro 2>&1 | tee qmake.log
          test "${PIPESTATUS[0]}" -eq 0
          mingw32-make -k -j2 -f Makefile.Release 2>&1 | tee build-qt.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Report compiler errors
        if: failure()
        run: |
          { cat build-*.log 2>/dev/null | grep -v -i "warning" | grep -i -E "error|undefined reference|No such file|cannot find|not found|multiple definition" | grep -v -E "runtime_error|bignum_error|key_error|_error\(|error_code" | head -60; \
            grep -B4 -E "\*\*\* \[" build-qt.log 2>/dev/null | grep -v "warning" | head -40; } | \
            while IFS= read -r l; do echo "::error::${l//%/%25}"; done || true

      - name: Package
        run: |
          set -x
          mkdir -p dist
          cp release/coppercoin-qt.exe dist/ || cp coppercoin-qt.exe dist/
          WINDEPLOYQT=$(command -v windeployqt-qt5 || command -v windeployqt)
          "$WINDEPLOYQT" --release --no-translations --no-compiler-runtime dist/coppercoin-qt.exe || echo "::warning::windeployqt failed"
          # copy the MinGW DLLs the exe depends on
          ldd dist/coppercoin-qt.exe | grep -i "/ucrt64/" | awk '{print $3}' | sort -u | while read -r f; do [ -e "dist/$(basename "$f")" ] || cp "$f" dist/; done

      - uses: actions/upload-artifact@v5
        with:
          name: coppercoin-qt-windows-x86_64
          path: dist/
